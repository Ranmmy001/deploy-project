name: Deployment project
on:
  push:
    branches:
      - deploy
jobs:
  Deployment-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout to root directory
        uses: actions/checkout@v6

      - name: Build Docker image for the app
        run: sudo docker build -t olaranmmy/deployproject:latest .  

      - name: login into the Dockerhub
        run: sudo docker login -u olaranmmy -p ${{ secrets.DOCKER_PASSWORD }}

      - name: push image to dockerhub
        run: sudo docker push olaranmmy/deployproject:latest

      - name: pull the image from Dockerhub to deploy life
        run: |
              sudo docker pull olaranmmy/deployproject:latest
              
              sudo docker stop deployproject_container || true
              sudo docker rm deployproject_container || true
              
              sudo docker run -d -p 1235:80 --name deployproject_container olaranmmy/deployproject:latest
     
  # NEW: SonarQube Analysis Job (SEPARATE!)
  # ============================================
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
   ## needs: Deployment-jobs # run AFTER Deployment-jobs succeeds
    
    
    steps:
      # Step 3.1: Checkout your code
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the entire full git history needed for accurate analysis

      # Step 3.2: Run SonarQube Scanner
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=false  # DON'T fail pipeline on Quality Gate (for now!)              










